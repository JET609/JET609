<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001a24"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="photoBg" gradientUnits="userSpaceOnUse" x1="18" y1="44" x2="126" y2="152">
      <stop offset="0%" stop-color="#001a06"/>
      <stop offset="100%" stop-color="#000c02"/>
    </linearGradient>
    <filter id="chipGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="photoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="458" height="218" rx="16"/>
    </clipPath>
    <clipPath id="barClip">
      <rect x="300" y="165" width="136" height="24"/>
    </clipPath>
    <clipPath id="photoClip">
      <rect x="18" y="44" width="108" height="108" rx="8"/>
    </clipPath>
  </defs>

  <!-- priming no-op -->
  <rect x="-10" y="-10" width="1" height="1" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" begin="0s" dur="0.01s"/>
  </rect>

  <rect x="1" y="1" width="458" height="218" rx="16" fill="url(#cardBg)" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.5"/>

  <g clip-path="url(#cardClip)">
    <!-- diagonal scanline sweep -->
    <g>
      <rect x="-460" y="-20" width="200" height="260" fill="url(#scanGrad)" transform="skewX(-20)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="920 0" begin="0.05s" dur="3.5s" repeatCount="indefinite" additive="sum"/>
      </rect>
    </g>

    <!-- header strip -->
    <rect x="0" y="0" width="460" height="34" fill="#00121a"/>
    <text x="18" y="22" font-family="Fira Code, monospace" font-size="12" fill="#00E5FF" letter-spacing="2">ACCESS CREDENTIAL</text>

    <!-- live status: pulsing dot + VALID + signal bars -->
    <circle cx="356" cy="18" r="3.5" fill="#92FF3E" filter="url(#dotGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <text x="365" y="22" font-family="Fira Code, monospace" font-size="12" fill="#92FF3E">VALID</text>
    <g fill="#92FF3E">
      <rect x="412" y="18" width="3" height="6">
        <animate attributeName="height" values="6;12;6" dur="1.1s" begin="0.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;12;18" dur="1.1s" begin="0.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="417" y="15" width="3" height="9">
        <animate attributeName="height" values="9;15;9" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
        <animate attributeName="y" values="15;9;15" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
      </rect>
      <rect x="422" y="11" width="3" height="13">
        <animate attributeName="height" values="13;18;13" dur="1.1s" begin="0.55s" repeatCount="indefinite"/>
        <animate attributeName="y" values="11;6;11" dur="1.1s" begin="0.55s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ASCII photo panel -->
    <rect x="18" y="44" width="108" height="108" rx="8" fill="url(#photoBg)" stroke="#92FF3E" stroke-opacity="0.6" stroke-width="1.3"/>
    <g clip-path="url(#photoClip)">
      <text font-family="Fira Code, monospace" font-size="6.98" fill="#92FF3E" filter="url(#photoGlow)" xml:space="preserve">
        <tspan x="23.0" y="54.5"> ..... .........--...:</tspan>
        <tspan x="23.0" y="61.5"> :.=-:-:--::.:::--:-:.</tspan>
        <tspan x="23.0" y="68.5">-:...::::=::::-=::=:. </tspan>
        <tspan x="23.0" y="75.5"> =.::.=:-==-++=--.::  </tspan>
        <tspan x="23.0" y="82.5"> :..==-:=-+-=*--. .:  </tspan>
        <tspan x="23.0" y="89.5"> -. ::=+:=-:-::: .:-=-</tspan>
        <tspan x="23.0" y="96.5">.:..:.:=.=@@+=++:.:: .</tspan>
        <tspan x="23.0" y="103.5">.:..==-+ :**-::-..:. .</tspan>
        <tspan x="23.0" y="110.5"> =- -:=:== + -:=: ::  </tspan>
        <tspan x="23.0" y="117.5"> :. :.::+:::-.:::==-  </tspan>
        <tspan x="23.0" y="124.5"> -. ::-==---=---=.:- -</tspan>
        <tspan x="23.0" y="131.5"> :.. .-- . ...  .-::.:</tspan>
        <tspan x="23.0" y="138.5"> :----=-----=--:---- .</tspan>
        <tspan x="23.0" y="145.5">-:..:-......--......= </tspan>
      </text>
      <!-- build-reveal curtain -->
      <rect x="18" y="49" width="108" height="98.0" fill="url(#photoBg)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 98.0;0 98.0" keyTimes="0;0.4;1" dur="8s" begin="0.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- corner brackets -->
    <g stroke="#92FF3E" stroke-width="1.4" fill="none" opacity="0.85">
      <path d="M15 54 v-13 h13"/>
      <path d="M116 41 h13 v13"/>
      <path d="M129 142 v13 h-13"/>
      <path d="M28 155 h-13 v-13"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" begin="0.1s" repeatCount="indefinite"/>
    </g>

    <!-- details: staggered data-refresh flicker -->
    <text x="140" y="90" font-family="Fira Code, monospace" font-size="18" font-weight="700" fill="#E6F1FF">Jayanth Eapen Thomas
      <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.85;0.9;1" dur="4.6s" begin="0.2s" repeatCount="indefinite"/>
    </text>
    <text x="140" y="112" font-family="Fira Code, monospace" font-size="12" fill="#8891A6">ROLE: Software Engineer
      <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.85;0.9;1" dur="4.6s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="140" y="130" font-family="Fira Code, monospace" font-size="12" fill="#8891A6">CLEARANCE: Automation &amp; AI
      <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.85;0.9;1" dur="4.6s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="140" y="148" font-family="Fira Code, monospace" font-size="12" fill="#8891A6">BASE: Kerala, India (IST)
      <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.85;0.9;1" dur="4.6s" begin="1.4s" repeatCount="indefinite"/>
    </text>

    <!-- chip -->
    <rect x="140" y="165" width="28" height="20" rx="3" fill="#FFBD4A" filter="url(#chipGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" begin="0.1s" repeatCount="indefinite"/>
    </rect>
    <line x1="144" y1="175" x2="164" y2="175" stroke="#7a4a00" stroke-width="1" stroke-opacity="0.6"/>

    <!-- barcode with scanning highlight sweep -->
    <g fill="#8891A6">
      <rect x="300" y="165" width="2" height="24"/>
      <rect x="306" y="165" width="4" height="24"/>
      <rect x="314" y="165" width="2" height="24"/>
      <rect x="320" y="165" width="6" height="24"/>
      <rect x="330" y="165" width="2" height="24"/>
      <rect x="336" y="165" width="3" height="24"/>
      <rect x="343" y="165" width="5" height="24"/>
      <rect x="352" y="165" width="2" height="24"/>
      <rect x="358" y="165" width="4" height="24"/>
      <rect x="366" y="165" width="2" height="24"/>
      <rect x="372" y="165" width="6" height="24"/>
      <rect x="382" y="165" width="3" height="24"/>
      <rect x="389" y="165" width="2" height="24"/>
      <rect x="395" y="165" width="5" height="24"/>
      <rect x="404" y="165" width="2" height="24"/>
      <rect x="410" y="165" width="4" height="24"/>
      <rect x="418" y="165" width="2" height="24"/>
      <rect x="424" y="165" width="6" height="24"/>
      <rect x="434" y="165" width="2" height="24"/>
    </g>
    <g clip-path="url(#barClip)">
      <rect x="292" y="165" width="16" height="24" fill="url(#barSweep)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="144 0" begin="0.3s" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
