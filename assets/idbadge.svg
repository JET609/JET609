<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001a24"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="chipGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="458" height="218" rx="16"/>
    </clipPath>
  </defs>

  <!-- priming no-op -->
  <rect x="-10" y="-10" width="1" height="1" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" begin="0s" dur="0.01s"/>
  </rect>

  <rect x="1" y="1" width="458" height="218" rx="16" fill="url(#cardBg)" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.5"/>

  <g clip-path="url(#cardClip)">
    <!-- diagonal scanline sweep -->
    <g>
      <rect x="-460" y="-20" width="200" height="260" fill="url(#scanGrad)" transform="skewX(-20)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="920 0" begin="0.05s" dur="3.5s" repeatCount="indefinite" additive="sum"/>
      </rect>
    </g>

    <!-- header strip -->
    <rect x="0" y="0" width="460" height="34" fill="#00121a"/>
    <text x="18" y="22" font-family="Fira Code, monospace" font-size="12" fill="#00E5FF" letter-spacing="2">ACCESS CREDENTIAL</text>
    <text x="442" y="22" text-anchor="end" font-family="Fira Code, monospace" font-size="12" fill="#92FF3E">VALID</text>

    <!-- photo placeholder -->
    <circle cx="72" cy="120" r="42" fill="#000814" stroke="#00E5FF" stroke-width="2"/>
    <text x="72" y="130" text-anchor="middle" font-family="Fira Code, monospace" font-size="26" font-weight="700" fill="#00E5FF">JT</text>

    <!-- details -->
    <text x="136" y="90" font-family="Fira Code, monospace" font-size="18" font-weight="700" fill="#E6F1FF">Jayanth Eapen Thomas</text>
    <text x="136" y="112" font-family="Fira Code, monospace" font-size="12" fill="#8891A6">ROLE: Software Engineer</text>
    <text x="136" y="130" font-family="Fira Code, monospace" font-size="12" fill="#8891A6">CLEARANCE: Automation &amp; AI</text>
    <text x="136" y="148" font-family="Fira Code, monospace" font-size="12" fill="#8891A6">BASE: Kerala, India (IST)</text>

    <!-- chip -->
    <rect x="136" y="165" width="28" height="20" rx="3" fill="#FFBD4A" filter="url(#chipGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" begin="0.1s" repeatCount="indefinite"/>
    </rect>

    <!-- barcode -->
    <g fill="#8891A6">
      <rect x="300" y="165" width="2" height="24"/>
      <rect x="306" y="165" width="4" height="24"/>
      <rect x="314" y="165" width="2" height="24"/>
      <rect x="320" y="165" width="6" height="24"/>
      <rect x="330" y="165" width="2" height="24"/>
      <rect x="336" y="165" width="3" height="24"/>
      <rect x="343" y="165" width="5" height="24"/>
      <rect x="352" y="165" width="2" height="24"/>
      <rect x="358" y="165" width="4" height="24"/>
      <rect x="366" y="165" width="2" height="24"/>
      <rect x="372" y="165" width="6" height="24"/>
      <rect x="382" y="165" width="3" height="24"/>
      <rect x="389" y="165" width="2" height="24"/>
      <rect x="395" y="165" width="5" height="24"/>
      <rect x="404" y="165" width="2" height="24"/>
      <rect x="410" y="165" width="4" height="24"/>
      <rect x="418" y="165" width="2" height="24"/>
      <rect x="424" y="165" width="6" height="24"/>
      <rect x="434" y="165" width="2" height="24"/>
    </g>
  </g>
</svg>
