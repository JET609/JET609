<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="0" y="0" width="760" height="260" rx="14"/>
    </clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00E5FF"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="758" height="258" rx="14" fill="#05060a" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.5"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="760" height="34" fill="#0b0f16"/>
    <circle cx="24" cy="17" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="17" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="17" r="6" fill="#27C93F"/>
    <text x="380" y="22" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#8891A6">jayanth@kerala: ~</text>
    <g font-family="Fira Code, monospace" font-size="16" fill="#E6F1FF">
      <text x="24" y="70" fill="#00E5FF">$ whoami</text>
      <text x="24" y="98" opacity="0">jayanth &#8212; builder, shipper, tinkerer<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.12;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="132" fill="#00E5FF" opacity="0">$ status --check<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.33;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="160" fill="#92FF3E" opacity="0">[OK] systems armed<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.5;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="186" fill="#92FF3E" opacity="0">[OK] shipping fast<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="220" fill="#00E5FF" opacity="0">$ _<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.83;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <rect x="52" y="207" width="10" height="16" fill="#00E5FF" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1;0" keyTimes="0;0.78;0.82;0.86;0.90;0.94;0.96;0.98;0.99;1" dur="9s" begin="0s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="0" y="0" width="760" height="260" fill="url(#scan)" opacity="0.05"/>
  </g>
</svg>
