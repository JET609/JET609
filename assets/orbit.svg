    <image x="316" y="495" width="44" height="44" href="https://cdn.simpleicons.org/openjdk/FFFFFF"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 300 300" to="480 300 300" dur="24s" repeatCount="indefinite"/>
    <image x="168" y="469" width="44" height="44" href="https://cdn.simpleicons.org/c/A8B9CC"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="160 300 300" to="520 300 300" dur="24s" repeatCount="indefinite"/>
    <image x="71" y="353" width="44" height="44" href="https://cdn.simpleicons.org/react/61DAFB"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="200 300 300" to="560 300 300" dur="24s" repeatCount="indefinite"/>
    <image x="71" y="203" width="44" height="44" href="https://cdn.simpleicons.org/flask/FFFFFF"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 300 300" to="600 300 300" dur="24s" repeatCount="indefinite"/>
    <image x="168" y="88" width="44" height="44" href="https://cdn.simpleicons.org/tensorflow/FF6F00"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="280 300 300" to="640 300 300" dur="24s" repeatCount="indefinite"/>
