<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="240" fill="none" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 10"/>
  <circle cx="300" cy="300" r="150" fill="none" stroke="#00E5FF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 8"/>

  <circle cx="300" cy="300" r="95" fill="url(#coreGlow)">
    <animate attributeName="r" values="90;104;90" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="300" r="46" fill="#000814" stroke="#00E5FF" stroke-width="2" filter="url(#softGlow)"/>
  <text x="300" y="308" text-anchor="middle" font-family="Fira Code, monospace" font-size="22" font-weight="700" fill="#00E5FF" filter="url(#softGlow)">JT</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="24s" repeatCount="indefinite"/>
    <image x="498" y="278" width="44" height="44" href="https://cdn.simpleicons.org/python/3776AB"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="40 300 300" to="400 300 300" dur="24s" repeatCount="indefinite"/>
    <image x="447" y="420" width="44" height="44" href="https://cdn.simpleicons.org/javascript/F7DF1E"/>
