<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="barGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="barFillCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="barFillGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92FF3E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#92FF3E"/>
    </linearGradient>
    <linearGradient id="barFillGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFBD4A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFBD4A"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Fira Code', monospace; }
    .label { fill: #E6F1FF; font-size: 15px; }
    .pct { fill: #8891A6; font-size: 13px; }
    .track { fill: #0d1117; stroke: #1c2530; stroke-width: 1; }
  </style>

  <!-- Python 92% -->
  <text x="0" y="20" class="label">Python</text>
  <text x="600" y="20" class="pct" text-anchor="end">92%</text>
  <rect x="0" y="30" width="640" height="14" rx="7" class="track"/>
  <rect x="2" y="32" height="10" rx="5" width="0" fill="url(#barFillCyan)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;585;585" keyTimes="0;0.5;1" dur="6s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 0 0"/>
  </rect>

  <!-- JavaScript 85% -->
  <text x="0" y="70" class="label">JavaScript</text>
  <text x="600" y="70" class="pct" text-anchor="end">85%</text>
  <rect x="0" y="80" width="640" height="14" rx="7" class="track"/>
  <rect x="2" y="82" height="10" rx="5" width="0" fill="url(#barFillGold)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;540;540" keyTimes="0;0.5;1" dur="6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 0 0"/>
  </rect>

  <!-- Java 78% -->
  <text x="0" y="120" class="label">Java</text>
  <text x="600" y="120" class="pct" text-anchor="end">78%</text>
  <rect x="0" y="130" width="640" height="14" rx="7" class="track"/>
  <rect x="2" y="132" height="10" rx="5" width="0" fill="url(#barFillCyan)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;495;495" keyTimes="0;0.5;1" dur="6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 0 0"/>
  </rect>

  <!-- React 80% -->
  <text x="0" y="170" class="label">React</text>
  <text x="600" y="170" class="pct" text-anchor="end">80%</text>
  <rect x="0" y="180" width="640" height="14" rx="7" class="track"/>
  <rect x="2" y="182" height="10" rx="5" width="0" fill="url(#barFillGreen)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;508;508" keyTimes="0;0.5;1" dur="6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 0 0"/>
  </rect>

  <!-- TensorFlow 70% -->
  <text x="0" y="220" class="label">TensorFlow</text>
  <text x="600" y="220" class="pct" text-anchor="end">70%</text>
  <rect x="0" y="230" width="640" height="14" rx="7" class="track"/>
  <rect x="2" y="232" height="10" rx="5" width="0" fill="url(#barFillGold)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;445;445" keyTimes="0;0.5;1" dur="6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 0 0"/>
  </rect>

  <!-- Docker 75% -->
  <text x="0" y="270" class="label">Docker</text>
  <text x="600" y="270" class="pct" text-anchor="end">75%</text>
  <rect x="0" y="280" width="640" height="14" rx="7" class="track"/>
  <rect x="2" y="282" height="10" rx="5" width="0" fill="url(#barFillCyan)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;476;476" keyTimes="0;0.5;1" dur="6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 0 0"/>
  </rect>

  <!-- Linux 82% -->
  <text x="0" y="320" class="label">Linux</text>
  <text x="600" y="320" class="pct" text-anchor="end">82%</text>
  <rect x="0" y="330" width="640" height="14" rx="7" class="track"/>
  <rect x="2" y="332" height="10" rx="5" width="0" fill="url(#barFillGreen)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;520;520" keyTimes="0;0.5;1" dur="6s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 0 0"/>
  </rect>

  <!-- C 65% -->
  <text x="0" y="370" class="label">C</text>
  <text x="600" y="370" class="pct" text-anchor="end">65%</text>
  <rect x="0" y="380" width="640" height="14" rx="7" class="track"/>
  <rect x="2" y="382" height="10" rx="5" width="0" fill="url(#barFillGold)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;413;413" keyTimes="0;0.5;1" dur="6s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 0 0"/>
  </rect>
</svg>
