<svg viewBox="0 0 700 8" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hdGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- priming no-op -->
  <rect x="-10" y="-10" width="1" height="1" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" begin="0s" dur="0.01s"/>
  </rect>

  <rect x="0" y="3" width="700" height="1.4" fill="#00E5FF" opacity="0.18"/>

  <g>
    <rect x="-140" y="0" width="140" height="8" fill="url(#hdGlow)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="840 0" begin="0.1s" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
