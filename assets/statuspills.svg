<svg viewBox="0 0 420 46" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pillGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 700; }
  </style>

  <!-- priming no-op -->
  <rect x="-10" y="-10" width="1" height="1" opacity="0">
    <animateTransform attributeName="transform" type="scale" from="1 1" to="1 1" begin="0s" dur="0.01s"/>
  </rect>

  <g transform="translate(0,3)">
    <rect x="0" y="0" width="185" height="34" rx="17" fill="#0d2f1a" stroke="#00C853" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#00C853">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" begin="0.05s" repeatCount="indefinite" filter="url(#pillGlow)"/>
    </circle>
    <text x="36" y="22" fill="#8FFFB0">STATUS: POLE POSITION</text>
  </g>

  <g transform="translate(200,3)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#00212b" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#00E5FF" filter="url(#pillGlow)">
      <animate attributeName="r" values="4;6;4" dur="2.4s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="22" fill="#8FE9FF">INDIA · IST</text>
  </g>
</svg>
