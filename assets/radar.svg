<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001a1f"/>
      <stop offset="100%" stop-color="#000814"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blipGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="radarClip">
      <circle cx="160" cy="160" r="140"/>
    </clipPath>
  </defs>

  <!-- priming no-op: the first animateTransform in an <img>-loaded SVG can
       fail to start; this absorbs that so the real sweep below fires. -->
  <rect x="-10" y="-10" width="1" height="1" opacity="0">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="0 0 0" begin="0s" dur="0.01s"/>
  </rect>

  <circle cx="160" cy="160" r="140" fill="url(#radarBg)" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="160" cy="160" r="105" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="160" cy="160" r="70" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="160" cy="160" r="35" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="20" y1="160" x2="300" y2="160" stroke="#00E5FF" stroke-opacity="0.15"/>
  <line x1="160" y1="20" x2="160" y2="300" stroke="#00E5FF" stroke-opacity="0.15"/>

  <g clip-path="url(#radarClip)">
    <g transform="rotate(0.1 160 160)">
      <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" begin="0.05s" dur="4s" repeatCount="indefinite"/>
      <path d="M160,160 L160,20 A140,140 0 0,1 258.99,86.99 Z" fill="url(#sweepGrad)"/>
    </g>
  </g>

  <!-- blips: ping and fade, staggered -->
  <circle cx="205" cy="110" r="4" fill="#92FF3E" filter="url(#blipGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.3;0" keyTimes="0;0.15;0.22;0.4;1" begin="0.6s" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="205" r="4" fill="#FFBD4A" filter="url(#blipGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.3;0" keyTimes="0;0.42;0.49;0.65;1" begin="0.6s" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="205" cy="215" r="4" fill="#00E5FF" filter="url(#blipGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.3;0" keyTimes="0;0.72;0.79;0.92;1" begin="0.6s" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="120" r="4" fill="#ff5f9c" filter="url(#blipGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.3;0" keyTimes="0;0.02;0.09;0.25;1" begin="0.6s" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="160" y="310" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#8891A6">SCANNING FOR COLLABORATORS...</text>
</svg>
